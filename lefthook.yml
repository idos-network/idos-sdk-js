pre-commit:
  commands:
    format:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files} && git update-index --again
    lint:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}"
      run: pnpm exec oxlint --fix {staged_files} && git update-index --again
