packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  "@reown/appkit": false
  "@sentry/cli": true
  blake-hash: true
  bufferutil: true
  es5-ext: true
  esbuild: true
  lefthook: true
  msw: true
  prisma: true
  secp256k1: true
  tiny-secp256k1: true
  usb: true
  utf-8-validate: true

catalogs:
  build:
    "@types/node": "25.9.5"
    "tsdown": "^0.23.0"
    "typescript": "^5.9.3"
    "vite": "8.2.4"
    "vite-plugin-node-polyfills": "0.28.0"

  core:
    "@digitalbazaar/ed25519-signature-2020": "^5.4.0"
    "@digitalbazaar/ed25519-verification-key-2020": "^4.2.0"
    "@digitalbazaar/vc": "^7.3.0"
    "jsonld-document-loader": "^2.3.0"
    "tiny-invariant": "^1.3.3"
    "tweetnacl": "^1.0.3"
    "web-streams-polyfill": "3.3.3"
    "zod": "4.6.7"

  ethereum:
    "@wagmi/core": "3.6.4"
    "ethers": "^6.17.0"
    "viem": "2.55.11"
    "wagmi": "3.7.6"

  near:
    "@near-wallet-selector/core": "8.10.2"
    "@near-wallet-selector/here-wallet": "8.10.2"
    "@near-wallet-selector/meteor-wallet": "8.10.2"
    "@near-wallet-selector/modal-ui": "8.10.2"
    "near-api-js": "4.0.4"

  otel:
    "@opentelemetry/api": "^1.10.0"
    "@opentelemetry/context-async-hooks": "^3.0.0"
    "@opentelemetry/instrumentation": "^0.300.0"
    "@opentelemetry/sdk-trace": "^3.0.0"
    "@opentelemetry/semantic-conventions": "^1.43.0"

  preact:
    "@preact/signals": "^2.11.0"
    "preact": "^10.29.8"

  react:
    "@types/react": "^19.2.18"
    "@types/react-dom": "^19.2.4"
    "react": "^19.2.8"
    "react-dom": "^19.2.8"

  react-router:
    "@react-router/dev": "^8.3.0"
    "@react-router/node": "^8.3.0"
    "@react-router/serve": "^8.3.0"
    "@vercel/react-router": "^1.3.2"
    "react-router": "^8.3.0"

  reown:
    # This version needs to be 1.7.20 untill this
    # https://github.com/reown-com/appkit/issues/5481
    # is solved.
    "@reown/appkit": "1.7.20"
    "@reown/appkit-adapter-wagmi": "1.7.20"

  stellar:
    "@creit.tech/stellar-wallets-kit": "^1.9.5"
    "@stellar/stellar-base": "^13.1.0"
    "@stellar/stellar-sdk": "^13.3.0"

  tanstack:
    "@tanstack/react-query": "^5.101.4"
    "@tanstack/react-query-devtools": "^5.101.4"
    "@tanstack/react-table": "^8.21.3"

  testing:
    "vitest": "4.1.11"
    "@vitest/coverage-v8": "4.1.11"

  utils:
    "@stablelib/base64": "^2.0.1"
    "@stablelib/binary": "^2.0.1"
    "@stablelib/bytes": "^2.0.1"
    "@stablelib/hex": "^2.0.1"
    "@stablelib/sha256": "^2.0.1"
    "@stablelib/utf8": "^2.1.0"
    "base85": "^3.2.0"
    "blockstore-core": "^7.0.1"
    "borsh": "^2.0.0"
    "bs58": "^6.0.0"
    "es-toolkit": "^1.50.0"
    "ipfs-unixfs-importer": "^17.1.1"
    "qs": "6.15.3"

  xrp:
    "@gemwallet/api": "^3.8.0"
    "ripple-binary-codec": "^2.8.0"
    "ripple-keypairs": "^2.0.0"
    "xrpl": "^4.6.0"
    "xumm": "^1.8.0"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Declared pins that may be newer than minimumReleaseAge
  - "@noble/hashes@2.3.0"

onlyBuiltDependencies:
  - "@prisma/engines"
  - tiny-secp256k1
  - protobufjs
  - esbuild
  - msw
  - "@reown/appkit"
  - "@sentry/cli"
  - "blake-hash"
  - "bufferutil"
  - "es5-ext"
  - "lefthook"
  - "prisma"
  - "secp256k1"
  - "usb"
  - "utf-8-validate"

overrides:
  # LRU-cache includes now forced dependency to node:diagnostic internal library
  "path-scurry>lru-cache": "11.5.2"

  # Overrides for security-updates (floors match top-level / catalog pins)
  "@react-router/dev": ">=8.3.0"
  "@react-router/node": ">=8.3.0"
  "@react-router/serve": ">=8.3.0"
  "brace-expansion": ">=5.0.11"
  "fast-uri": ">= 4.1.3"
  "ip-address": ">= 10.3.1"
  # Security: undici DoS and TLS bypass (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3)
  # Pin the major. An open range lets pnpm reuse a vulnerable release already in the lockfile.
  "undici@6": "6.29.1"
  "undici@7": "7.30.1"
  axios: ">=1.20.0"
  # Security: header stripping bypass (GHSA-8r9p-f939-6h3c, GHSA-q3jh-wrc6-jgq8)
  "follow-redirects": "1.16.1"
  base-x: ">=3.0.11"
  compression: ">= 1.8.2"
  # Security overrides. Each one blocks a dependent whose declared range still
  # resolves to a vulnerable release. Drop an entry once that dependent moves on.
  lodash: ">= 4.18.0"
  mysql2: ">= 3.22.0"
  protobufjs: ">=7.5.5"
  secp256k1: ">=5.0.1"
  seroval: ">= 1.6.3"
  tinypool: ">= 2.1.1"
  # Security: toml DoS in parse() (GHSA-4qx8-w7c3-pj3p, GHSA-9j65-hcg3-gc64, GHSA-9qmh-m7c6-f92p).
  # Pin the patch. An open range lets pnpm reuse 5.0.0 already in the lockfile.
  toml: "5.0.1"
  # Security: DOMPurify template and IN_PLACE bypass (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr).
  dompurify: ">=3.4.17"
  # Security: Zod memory exhaustion on oversized constrained collections (GHSA-mrhx-c7xc-m3w5).
  # Pin every copy. Zod 3 is inside the advisory range and has no 3.x fix.
  zod: "4.6.7"
  # Security: body-parser DoS from trailing bytes after a compressed body (GHSA-27r3-jxmh-p828).
  # Pin the patch. An open range lets pnpm reuse 2.3.0 already in the lockfile.
  "body-parser@2": "2.4.0"
  # Security: launch-editor Windows path check bypass (GHSA-587h-7wmj-h5pm).
  # Pin the patch. An open range lets pnpm reuse a vulnerable release already in the lockfile.
  vite: "8.2.4"
  "launch-editor": "2.14.2"
  ws: ">= 8.21.0"

  # Since version 11.0 this is ESM only, but there is a nested dependency error, which relies on commonJS import
  "chevrotain": "10.5.0"

  # We are including a lot of those, but we need just this one
  web-streams-polyfill: "3.3.3"

  # Bs58 is broken < 6.0.0 together with vite 8.x
  # but the import is the same
  bs58: "6.0.0"

  # Security: nanoid infinite loop (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8)
  "nanoid@3": "3.3.18"

  # Security: deepmerge-ts stack exhaustion on recursive graphs (GHSA-ggr8-5vv4-36mx)
  # Prisma still pins 7.1.5; no 7.x patch exists (fix is >=8.0.0).
  deepmerge-ts: ">=8.0.1"

strictDepBuilds: true
