# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Keep the organization's UI settings (review profile, tools, ...) and change only the keys below.
inheritance: true

language: en

chat:
  auto_reply: true

reviews:
  # Review budget: every PR open, push, "Update branch", force-push and `@coderabbitai review`
  # costs one review attempt for the PR author, and more than ~40 attempts in 7 days cuts the
  # hourly allowance from 8 to 1-2. So: review when the PR opens, then only on request.
  auto_review:
    enabled: true
    # Drafts are skipped; marking a PR ready for review triggers one review.
    drafts: false
    # Pushes after the first review are not reviewed on their own.
    # Comment `@coderabbitai review` once a round of fixes is pushed.
    auto_incremental_review: false
    # "chore: update versions" is the changesets release PR (versions and CHANGELOGs only).
    # For any other trivial PR, put `@coderabbitai ignore` in the description.
    ignore_title_keywords:
      - "WIP"
      - "update versions"
      - "no-review"
    labels:
      - "!no-review"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.turbo/**"
    - "!.pnpm-store/**"
    - "!pnpm-lock.yaml"
    - "!**/CHANGELOG.md" # written by changesets
    - "!packages/enclave/src/mpc/generated/**" # binding generated from the partisia contract
    - "!**/public/**" # static assets and the vendored FaceTec SDK
    - "!docs/assets/**"

  path_instructions:
    - path: "packages/**/src/**/*.ts"
      instructions: |
        Published @idos-network/* packages, used by partners and by relay (which pins exact versions).
        - A change to the public API needs a changeset with the right semver level; removing or
          renaming an export, a parameter or a return field is a breaking change
        - Code must work in browsers and Node (no Node-only APIs in browser entry points)
        - No logging or error messages that carry keys, signatures, credential content or
          wallet addresses
        - packages/instrumentation/src/targets.ts patches public methods by name: a renamed or
          removed method on an instrumented class (kwil-infra, client, issuer, consumer) silently
          drops its span. Span attributes must not carry user input, addresses or credential data

    - path: "packages/kwil-infra/src/actions/actions.ts"
      instructions: |
        Generated by the idos-schema generator and copied here. Do not review style. Flag only
        signs of hand edits (code that does not look like generator output); the fix is to change
        the SQL action or its @generator directives in idos-schema and regenerate.

    - path: "packages/kwil-js/**/*.ts"
      instructions: |
        idOS fork of kwil-js. Keep the diff small. Transaction and message encoding, signing
        payloads and auth must stay byte-compatible with kwild (idos-network/kwilteam-kwil-db)
        and KGW; flag any change to serialization without a matching node-side change.

    - path: "packages/enclave/**/*.ts"
      instructions: |
        Key handling and encryption for the user's data.
        - Secret keys and decrypted content never leave the enclave or reach logs/telemetry
        - MPC secret sharing: shares, thresholds and node lists are validated; a failing or
          malicious node cannot cause a wrong secret to be accepted
        - Stored keys are wiped on logout and when the user or key changes

    - path: "packages/credentials/**"
      instructions: |
        Verifiable credential schemas, JSON-LD contexts and the verifier.
        - Contexts in verifier/published-contexts.json and the vocabulary they point to are
          already used by issued credentials: changing an existing IRI or term definition breaks
          verification of credentials already in idOS. New fields or meanings need a new
          schema/context version (e.g. KycV4), not an edit of the old one
        - The verifier must reject unknown or remote contexts it has not pinned
        - Tests cover both accepted and rejected credentials

    - path: "apps/{idos-enclave,facesign-enclave}/**"
      instructions: |
        Enclave apps run in an iframe on a separate origin and hold user keys.
        - postMessage handlers check event.origin against the allowed parent origins and
          validate message shape before acting
        - Trust anchors and origins are pinned in source, not taken from the parent or URL
        - No key material in localStorage beyond what the design requires; wipe on logout
        - Headers and rewrites in vercel.json must not be loosened (framing, caching, origins)

    - path: "apps/{idos-data-dashboard,embedded-wallet}/**"
      instructions: |
        React apps deployed on Vercel.
        - Client bundles: only public configuration (VITE_*), never secrets
        - User data shown or sent only after the enclave/consent flow; no PII in URLs or analytics
        - Server code (apps/idos-data-dashboard/server) validates input and authenticates sessions
        - Prisma migrations are safe to run before the new code is live (no destructive change
          without a prior release)

    - path: "**/*.test.ts"
      instructions: |
        Vitest. Assert on behavior, not on mock call counts alone; cover the rejection path for
        any security check the change adds.

    - path: ".changeset/*.md"
      instructions: |
        The bump level matches the change (breaking public API means major for 1.x+ packages).
        The summary is written for package users. @idos-network/client, consumer and issuer are
        versioned together.

    - path: ".github/workflows/*.yml"
      instructions: |
        - Third-party actions pinned to a SHA; secrets never echoed
        - Publish and deploy jobs cannot run from untrusted pull requests
        - npm publishing stays on trusted publishing (OIDC) with provenance; no long-lived npm tokens
