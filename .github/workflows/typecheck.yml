name: Typecheck

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - playground
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install

      - run: pnpm build:packages

      - run: pnpm typecheck
