name: Release

on:
  push:
    branches:
      - main

env:
  CI: true

# Only the `publish` job can mint an npm OIDC token, and it runs no repository code:
# it publishes tarballs built by `build`. All actions are pinned to commit SHAs.
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      unpublished: ${{ steps.unpublished.outputs.dirs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore: update versions"
          title: "chore: update versions"
          commitMode: github-api # commits signed by GitHub (Verified)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Avoid asking the "npm" environment reviewers to approve a no-op publish.
      - name: Find unpublished versions
        id: unpublished
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          dirs=""
          for f in packages/*/package.json; do
            [ "$(jq -r '.private // false' "$f")" = "true" ] && continue
            spec="$(jq -r '"\(.name)@\(.version)"' "$f")"
            if [ -z "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "Unpublished: $spec"
              dirs="$dirs $(dirname "$f")"
            fi
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.unpublished != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install

      - name: Build packages
        run: pnpm build:packages

      - name: Validate package manifests
        run: pnpm publint

      - name: Pack unpublished packages
        env:
          DIRS: ${{ needs.version.outputs.unpublished }}
        run: |
          for dir in $DIRS; do
            pnpm --dir "$dir" pack --pack-destination "$RUNNER_TEMP/tarballs"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Gated by the "npm" environment reviewers.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarballs
          path: tarballs

      # npm >= 11.5.1 is required for trusted publishing; Node 24 ships it.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Publish tarballs
        run: |
          # "./" matters: npm reads "tarballs/x.tgz" as a GitHub "owner/repo" spec.
          for tgz in ./tarballs/*.tgz; do
            npm publish "$tgz" --access public --provenance --ignore-scripts
          done

  # Tags and GitHub releases for the versions just published (`changeset tag` prints "New tag:" lines).
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install

      - name: Create tags and GitHub releases
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
