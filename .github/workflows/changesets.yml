name: Release

on:
  push:
    branches:
      - main

env:
  CI: true

# Only the `publish` job can mint an npm OIDC token, and it runs no repository code:
# it publishes tarballs built by `build`. All actions are pinned to commit SHAs.
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      unpublished: ${{ steps.unpublished.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit: "chore: update versions"
          title: "chore: update versions"
          commitMode: github-api # commits signed by GitHub (Verified)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Avoid asking the "npm" environment reviewers to approve a no-op publish.
      - name: Find unpublished versions
        id: unpublished
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          dirs=""
          for f in packages/*/package.json; do
            [ "$(jq -r '.private // false' "$f")" = "true" ] && continue
            spec="$(jq -r '"\(.name)@\(.version)"' "$f")"
            if [ -z "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "Unpublished: $spec"
              dirs="$dirs $(dirname "$f")"
            fi
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.unpublished != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install

      - name: Build packages
        run: pnpm build:packages

      - name: Validate package manifests
        run: pnpm publint

      - name: Pack unpublished packages
        env:
          DIRS: ${{ needs.version.outputs.unpublished }}
        run: |
          for dir in $DIRS; do
            pnpm --dir "$dir" pack --pack-destination "$RUNNER_TEMP/tarballs"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Gated by the "npm" environment reviewers.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      # Needs an npm with `npm stage` (11.19.1 at the time of writing); Node 24 ships it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The npm trust relationship only allows staging; a maintainer approves each
      # staged version with 2FA (`npm stage approve`) to make it public.
      - name: Stage tarballs
        run: |
          # "./" matters: npm reads "tarballs/x.tgz" as a GitHub "owner/repo" spec.
          for tgz in ./tarballs/*.tgz; do
            spec="$(tar -xOf "$tgz" package/package.json | jq -r '"\(.name)@\(.version)"')"
            # Staged versions are invisible to `npm view`, so `version` lists them as unpublished;
            # one approved while this job waited for its environment reviewers must be skipped.
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "Already published: $spec"
              continue
            fi
            npm stage publish "$tgz" --access public --provenance --ignore-scripts
          done

  # Tags and GitHub releases for the versions just published (`changeset tag` prints "New tag:" lines).
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install

      - name: Create tags and GitHub releases
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
